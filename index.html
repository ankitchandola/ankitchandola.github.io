      content="Ankit Chandola, full-stack developer in Delhi. Operations software, CRM workflows, shared React components and browser tools."

    <link href="/assets/favicon.svg" rel="icon" type="image/svg+xml" />
    <link
      as="font"
      crossorigin=""
      href="/assets/fonts/display.woff"
      rel="preload"
      type="font/woff"
    />
    <link
      as="font"
      crossorigin=""

    <link href="/assets/v2.css" rel="stylesheet" />
    <script src="/src/home/client.js" type="module"></script>
    <script>
      try {
        var t = localStorage.getItem('ankit-theme');
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script src="/assets/theme.js" defer></script>
  </head>
